backend:
  name: turbo-github
  turbo_site_id: 39f7de4b-c963-44f6-a8be-7b68097250ae
  branch: main

media_folder: "assets/products"
public_folder: "assets/products"

collections:
  - name: "catalog"
    label: "Sản phẩm"
    description: "Thêm, sửa, xóa và sắp xếp các sản phẩm bảo hộ lao động."
    files:
      - name: "products"
        label: "Danh mục sản phẩm"
        file: "data/products.json"
        fields:
          - label: "Danh sách sản phẩm"
            name: "products"
            widget: "list"
            allow_add: true
            allow_remove: true
            allow_reorder: true
            add_to_top: true
            collapsed: true
            summary: "{{fields.name}} — {{fields.brand}}"
            label_singular: "Thêm sản phẩm"
            fields:
              - label: "Tên sản phẩm"
                name: "name"
                widget: "string"
                hint: "Tên hiển thị trên website."

              - label: "Tên hãng"
                name: "brand"
                widget: "string"
                hint: "Ví dụ: 3M, K2, Hans, Kingman..."

              - label: "Nhóm sản phẩm"
                name: "category"
                widget: "select"
                options:
                  - {label: "Quần áo", value: "clothing"}
                  - {label: "Giày bảo hộ", value: "footwear"}
                  - {label: "Mũ & bảo vệ đầu", value: "head"}
                  - {label: "Găng tay", value: "hand"}
                  - {label: "Kính & mặt", value: "eye"}
                  - {label: "Chống rơi", value: "fall"}
                  - {label: "Bảo vệ hô hấp", value: "respiratory"}

              - label: "Ảnh sản phẩm"
                name: "image"
                widget: "image"
                required: false
                hint: "Ưu tiên WebP/JPEG đã tối ưu."
                media_library:
                  config:
                    max_file_size: 5242880

              - label: "Mô tả"
                name: "description"
                widget: "text"
                required: false
                hint: "Mô tả ngắn hiển thị trên card và cửa sổ chi tiết."